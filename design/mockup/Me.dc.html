<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARAW · Me and accessibility</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#35408E}a:hover{color:#1F2550}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;height:60px;text-decoration:none;color:#6B7090;font-weight:700;font-size:12px}
.tab:hover{color:#1F2550}
.pill{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FF7A59;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{pageBg}}; font-family: Nunito, sans-serif; color: #1F2550; overflow: hidden;">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #F5D89E;">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; color: #35408E;">Me</h1>
<a href="Report.dc.html" aria-label="Report a problem" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; color: #35408E;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
</a>
</header>
<main style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; zoom: {{zoom}};">
<section style="background: #FFFFFF; border-radius: 24px; padding: 16px; border: {{cardBorder}}; box-shadow: 0 3px 0 #EADFC8; display: flex; flex-direction: column; gap: 12px;">
<div style="display: flex; align-items: center; gap: 12px;">
<div style="width: 72px; height: 72px; border-radius: 36px; background: #F5D89E; display: flex; align-items: center; justify-content: center; overflow: hidden;">
<svg width="64" height="64" viewBox="0 0 48 48" role="img" aria-label="Your avatar">
<path d="M10 48 Q12 38 24 38 Q36 38 38 48 Z" fill="{{me.shirt}}"></path>
<circle cx="24" cy="26" r="12" fill="{{me.skin}}"></circle>
<path d="{{me.hair}}" fill="{{me.hairColor}}"></path>
<circle cx="19.5" cy="27" r="1.6" fill="#1F2550"></circle>
<circle cx="28.5" cy="27" r="1.6" fill="#1F2550"></circle>
<path d="M20.5 31.5 Q24 34.5 27.5 31.5" stroke="#1F2550" stroke-width="1.6" fill="none" stroke-linecap="round"></path>
<path d="{{me.glasses}}" stroke="#1F2550" stroke-width="1.4" fill="none"></path>
</svg>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
<label for="nick" style="font-size: 13px; font-weight: 800; color: {{muted}};">Nickname</label>
<input id="nick" type="text" value="Kaibigan" style="height: 44px; padding: 0 12px; border: 2px solid #EADFC8; border-radius: 12px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; color: #1F2550; background: #FFF8EC;">
</div>
</div>
<p style="margin: 0; font-size: 13px; font-weight: 800; color: {{muted}};">Pick your avatar</p>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px;">
<sc-for list="{{avatars}}" as="a" hint-placeholder-count="6">
<button type="button" onClick="{{a.pick}}" aria-label="{{a.label}}" aria-pressed="{{a.pressed}}" style="position: relative; height: 52px; padding: 0; border: 3px solid {{a.ring}}; border-radius: 26px; background: #FFF8EC; cursor: pointer; overflow: hidden;">
<svg width="46" height="46" viewBox="0 0 48 48" aria-hidden="true">
<path d="M10 48 Q12 38 24 38 Q36 38 38 48 Z" fill="{{a.shirt}}"></path>
<circle cx="24" cy="26" r="12" fill="{{a.skin}}"></circle>
<path d="{{a.hair}}" fill="{{a.hairColor}}"></path>
<circle cx="19.5" cy="27" r="1.6" fill="#1F2550"></circle>
<circle cx="28.5" cy="27" r="1.6" fill="#1F2550"></circle>
<path d="{{a.glasses}}" stroke="#1F2550" stroke-width="1.4" fill="none"></path>
</svg>
<sc-if value="{{a.chair}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; border-radius: 9px; background: #35408E; display: flex; align-items: center; justify-content: center;">
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M10 4a1 1 0 1 0 0.01 0 M10 8v6h6l2 5 M14 20a6 6 0 1 1-8-8"></path></svg>
</span>
</sc-if>
</button>
</sc-for>
</div>
</section>
<section style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
<div style="background: #FFFFFF; border-radius: 18px; border: {{cardBorder}}; padding: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 0 #EADFC8;"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; color: #35408E;">240</span><span style="font-size: 13px; font-weight: 700; color: {{muted}};">XP</span></div>
<div style="background: #FFFFFF; border-radius: 18px; border: {{cardBorder}}; padding: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 0 #EADFC8;"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; color: #35408E;">3</span><span style="font-size: 13px; font-weight: 700; color: {{muted}};">Day streak</span></div>
<div style="background: #FFFFFF; border-radius: 18px; border: {{cardBorder}}; padding: 12px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 0 #EADFC8;"><span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; color: #35408E;">2/10</span><span style="font-size: 13px; font-weight: 700; color: {{muted}};">Badges</span></div>
</section>
<section style="background: #FFFFFF; border-radius: 24px; border: {{cardBorder}}; padding: 16px; box-shadow: 0 3px 0 #EADFC8; display: flex; flex-direction: column; gap: 6px;">
<h2 style="margin: 0 0 6px; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; color: #35408E;">Accessibility</h2>
<p style="margin: 0 0 4px; font-size: 14px; color: {{muted}};">All off by default. Turn on what helps you.</p>
<sc-for list="{{settings}}" as="t" hint-placeholder-count="5">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; border-top: 1px solid #F3ECDD;">
<div style="display: flex; flex-direction: column;">
<span style="font-weight: 800; font-size: 16px;">{{t.label}}</span>
<span style="font-size: 13px; color: {{muted}};">{{t.hint}}</span>
</div>
<button type="button" role="switch" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.toggle}}" style="flex-shrink: 0; width: 56px; height: 32px; padding: 3px; border: 0; border-radius: 16px; background: {{t.track}}; cursor: pointer; display: flex; justify-content: {{t.justify}};">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.25);"></span>
</button>
</div>
</sc-for>
</section>
<section style="background: #FFFFFF; border-radius: 24px; border: {{cardBorder}}; box-shadow: 0 3px 0 #EADFC8; display: flex; flex-direction: column; overflow: hidden;">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px;"><span style="font-weight: 800; font-size: 16px;">Language</span><span style="font-size: 14px; color: {{muted}};">English · more coming</span></div>
<a href="Report.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border-top: 1px solid #F3ECDD; text-decoration: none; color: #1F2550; font-weight: 800; font-size: 16px;">Report a problem<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#35408E" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a>
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; padding: 0 16px; border-top: 1px solid #F3ECDD;"><span style="font-weight: 800; font-size: 16px;">About and licences</span><span style="font-size: 13px; color: {{muted}};">MIT · CC BY 4.0</span></div>
</section>
</main>
<nav aria-label="Main" style="height: 76px; flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; background: #FFFFFF; border-top: 1px solid #EADFC8;">
<a class="tab" href="Home.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home</a>
<a class="tab" href="Learn.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"></path></svg></span>Learn</a>
<a class="tab" href="Arcade.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"></rect><path d="M7 11v4M5 13h4"></path><circle cx="15.5" cy="12" r="1"></circle><circle cx="18" cy="14.5" r="1"></circle></svg></span>Arcade</a>
<a class="tab" href="Library.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg></span>Library</a>
<a class="tab" href="Me.dc.html" aria-current="page" style="color: #1F2550;"><span class="pill" style="background: #F5D89E;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { av: 0, on: { text: false, contrast: false, targets: false, reader: false, motion: false } }; }
renderVals() {
const s = this.state;
const H = {
long: 'M10 30 Q9 12 24 11 Q39 12 38 30 L38 40 L33 40 L33 24 Q24 18 15 24 L15 40 L10 40 Z',
short: 'M12 24 Q12 11 24 11 Q36 11 36 24 Q30 17 24 18 Q18 17 12 24 Z',
bun: 'M12 24 Q12 12 24 12 Q36 12 36 24 Q30 18 24 18 Q18 18 12 24 Z M19 9 a5 5 0 1 0 10 0 a5 5 0 1 0 -10 0',
hijab: 'M8 48 Q8 10 24 9 Q40 10 40 48 L34 48 Q36 34 35 26 Q34 16 24 16 Q14 16 13 26 Q12 34 14 48 Z'
};
const G = 'M14 26a4 4 0 1 0 8 0a4 4 0 1 0 -8 0 M26 26a4 4 0 1 0 8 0a4 4 0 1 0 -8 0 M22 26h4';
const list = [
{ label: 'Young woman, long hair', skin: '#E2A77E', hair: H.long, hairColor: '#2B2118', shirt: '#35408E', glasses: '', chair: false },
{ label: 'Young man, short hair', skin: '#A86B45', hair: H.short, hairColor: '#1A1410', shirt: '#FF7A59', glasses: '', chair: false },
{ label: 'Lola with a bun', skin: '#D9A07A', hair: H.bun, hairColor: '#B9B6B0', shirt: '#2FA36B', glasses: G, chair: false },
{ label: 'Woman in a hijab', skin: '#C98E66', hair: H.hijab, hairColor: '#35408E', shirt: '#E8B84A', glasses: '', chair: false },
{ label: 'Lolo with glasses', skin: '#B97B52', hair: H.short, hairColor: '#C9C6C0', shirt: '#4A56A8', glasses: G, chair: false },
{ label: 'Teen wheelchair user', skin: '#8C5A3C', hair: H.short, hairColor: '#1A1410', shirt: '#E8B84A', glasses: '', chair: true }
];
const avatars = list.map((a, i) => Object.assign({}, a, {
ring: s.av === i ? '#FF7A59' : '#EADFC8',
pressed: s.av === i ? 'true' : 'false',
pick: () => this.setState({ av: i })
}));
const defs = [
['text', 'Larger text', 'Makes all words bigger'],
['contrast', 'High contrast', 'Stronger colours for bright sun or low vision'],
['targets', 'Extra-large buttons', 'Bigger tap areas'],
['reader', 'Screen-reader hints', 'Extra spoken descriptions for TalkBack'],
['motion', 'Reduce motion', 'Fewer bounces and no confetti']
];
const settings = defs.map((d) => {
const on = !!s.on[d[0]];
return {
label: d[1], hint: d[2],
checked: on ? 'true' : 'false',
track: on ? '#1E7D50' : '#B9BCCF',
justify: on ? 'flex-end' : 'flex-start',
toggle: () => { const o = Object.assign({}, s.on); o[d[0]] = !o[d[0]]; this.setState({ on: o }); }
};
});
const hc = !!s.on.contrast;
return {
me: avatars[s.av], avatars: avatars, settings: settings,
zoom: s.on.text ? '1.15' : '1',
pageBg: hc ? '#FFFFFF' : '#FFF8EC',
cardBorder: hc ? '2px solid #1F2550' : '0',
muted: hc ? '#1F2550' : '#4A4F6A'
};
}
}
</script>
