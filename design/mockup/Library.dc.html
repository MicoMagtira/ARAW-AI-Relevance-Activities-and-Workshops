<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARAW · Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#35408E}a:hover{color:#1F2550}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:64px;height:60px;text-decoration:none;color:#6B7090;font-weight:700;font-size:12px}
.tab:hover{color:#1F2550}
.pill{display:flex;align-items:center;justify-content:center;width:52px;height:30px;border-radius:15px}
.card{transition:transform 120ms ease}
.card:hover{transform:translateY(-1px)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #FF7A59;outline-offset:3px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFF8EC; font-family: Nunito, sans-serif; color: #1F2550; overflow: hidden;">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #F5D89E;">
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 22px; color: #35408E;">Library</h1>
<a href="Report.dc.html" aria-label="Report a problem" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; color: #35408E;">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>
</a>
</header>
<div role="tablist" aria-label="Library sections" style="flex-shrink: 0; margin: 14px 16px 4px; padding: 4px; border-radius: 18px; background: #F3ECDD; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
<button type="button" role="tab" aria-selected="{{t.sel}}" onClick="{{t.pick}}" style="height: 44px; border: 0; border-radius: 14px; background: {{t.bg}}; color: {{t.fg}}; font-family: Nunito, sans-serif; font-weight: 800; font-size: 15px; cursor: pointer;">{{t.label}}</button>
</sc-for>
</div>
<main style="flex: 1; overflow-y: auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 12px;">
<sc-if value="{{showMyths}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 14px; color: #4A4F6A;">Tap a myth to flip it.</p>
<sc-for list="{{myths}}" as="m" hint-placeholder-count="3">
<button class="card" type="button" onClick="{{m.flip}}" aria-expanded="{{m.openStr}}" style="display: flex; flex-direction: column; gap: 8px; width: 100%; padding: 16px; border: 0; border-radius: 20px; background: {{m.bg}}; box-shadow: 0 3px 0 #EADFC8; text-align: left; cursor: pointer; font-family: Nunito, sans-serif; color: #1F2550;">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: {{m.kickerColor}};">{{m.kicker}}</span>
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; line-height: 1.2;">{{m.headline}}</span>
<sc-if value="{{m.open}}" hint-placeholder-val="{{false}}">
<span style="font-size: 15px; line-height: 1.5;">{{m.fact}}</span>
<span style="align-self: flex-start; padding: 4px 10px; border-radius: 10px; background: #35408E; color: #FFFFFF; font-size: 12px; font-weight: 800;">Trick: {{m.trick}}</span>
</sc-if>
</button>
</sc-for>
</sc-if>
<sc-if value="{{showDict}}" hint-placeholder-val="{{false}}">
<label for="dict-search" style="font-size: 14px; font-weight: 700; color: #4A4F6A;">Search a word</label>
<input id="dict-search" type="search" placeholder="e.g. deepfake" style="height: 48px; padding: 0 16px; border: 2px solid #EADFC8; border-radius: 14px; background: #FFFFFF; font-family: Nunito, sans-serif; font-size: 16px; color: #1F2550;">
<sc-for list="{{terms}}" as="w" hint-placeholder-count="5">
<article style="padding: 14px 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 3px 0 #EADFC8; display: flex; flex-direction: column; gap: 6px;">
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 19px; color: #35408E;">{{w.term}}</span>
<span style="font-size: 15px; line-height: 1.45;">{{w.meaning}}</span>
<span style="font-size: 14px; line-height: 1.45; color: #4A4F6A;">Halimbawa: {{w.example}}</span>
</article>
</sc-for>
</sc-if>
<sc-if value="{{showKomiks}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 14px; color: #4A4F6A;">Season 1 · The Miracle Tea. A new episode unlocks with each module.</p>
<sc-for list="{{eps}}" as="e" hint-placeholder-count="3">
<article style="border-radius: 22px; background: #FFFFFF; box-shadow: 0 3px 0 #EADFC8; overflow: hidden; opacity: {{e.op}};">
<div style="height: 120px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: {{e.strip}};">
<div style="border-radius: 12px; background: #FFF8EC; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #6B7090;">Panel 1</div>
<div style="border-radius: 12px; background: #FFF8EC; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #6B7090;">Panel 2</div>
<div style="border-radius: 12px; background: #FFF8EC; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #6B7090;">Panel 3</div>
</div>
<div style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px;">
<div style="display: flex; flex-direction: column;">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #6B7090;">EPISODE {{e.n}}</span>
<span style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 18px;">{{e.title}}</span>
</div>
<span style="font-size: 13px; font-weight: 800; color: {{e.statusColor}};">{{e.status}}</span>
</div>
</article>
</sc-for>
</sc-if>
</main>
<nav aria-label="Main" style="height: 76px; flex-shrink: 0; display: flex; justify-content: space-around; align-items: center; background: #FFFFFF; border-top: 1px solid #EADFC8;">
<a class="tab" href="Home.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg></span>Home</a>
<a class="tab" href="Learn.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="6" cy="19" r="2"></circle><circle cx="18" cy="5" r="2"></circle><path d="M8 19h7a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h7"></path></svg></span>Learn</a>
<a class="tab" href="Arcade.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"></rect><path d="M7 11v4M5 13h4"></path><circle cx="15.5" cy="12" r="1"></circle><circle cx="18" cy="14.5" r="1"></circle></svg></span>Arcade</a>
<a class="tab" href="Library.dc.html" aria-current="page" style="color: #1F2550;"><span class="pill" style="background: #F5D89E;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"></path><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"></path></svg></span>Library</a>
<a class="tab" href="Me.dc.html"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span>Me</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'myths', open: { 0: false, 1: false, 2: false } }; }
renderVals() {
const s = this.state;
const tabs = [['myths', 'Myths'], ['dict', 'Diksyunaryo'], ['komiks', 'Komiks']].map((p) => ({
label: p[1], sel: s.tab === p[0] ? 'true' : 'false',
bg: s.tab === p[0] ? '#35408E' : 'transparent',
fg: s.tab === p[0] ? '#FFFFFF' : '#1F2550',
pick: () => this.setState({ tab: p[0] })
}));
const mythData = [
{ myth: 'Tawa-tawa cures dengue.', fact: 'No herbal remedy is a proven cure for dengue. Drink fluids, rest, watch for warning signs, and see a health worker.', trick: 'Miracle Mike' },
{ myth: 'Antibiotics cure colds and flu.', fact: 'Colds and flu are caused by viruses. Antibiotics do not work on viruses, and taking them when not needed helps germs become resistant.', trick: 'Kwento Kim' },
{ myth: 'If a doctor says it in a video, it must be true.', fact: 'Videos of doctors can be made with AI. Check the doctor’s official page and the product’s FDA registration first.', trick: 'Dr. Fake' }
];
const myths = mythData.map((m, i) => {
const open = !!s.open[i];
return {
open: open, openStr: open ? 'true' : 'false',
kicker: open ? 'THE FACT' : 'MYTH',
kickerColor: open ? '#1E7D50' : '#C4323A',
headline: open ? 'Myth: ' + m.myth : m.myth,
fact: m.fact, trick: m.trick,
bg: open ? '#E3F4EA' : '#FFFFFF',
flip: () => { const o = Object.assign({}, s.open); o[i] = !o[i]; this.setState({ open: o }); }
};
});
const terms = [
{ term: 'Algorithm', meaning: 'A set of steps a computer follows to decide something, like what shows up in your feed.', example: 'Kaya puro lechon videos ang lumalabas sa feed mo.' },
{ term: 'Hallucination', meaning: 'When an AI confidently makes up something that is not true.', example: 'The chatbot invented a medicine that does not exist.' },
{ term: 'Deepfake', meaning: 'A fake video, photo or voice made with AI to look or sound like a real person.', example: 'An ad showing a famous doctor saying things they never said.' },
{ term: 'Training data', meaning: 'The examples an AI learns from. Bad examples, bad AI.', example: 'An AI that only learned English posts misses Bisaya ones.' },
{ term: 'Prompt', meaning: 'What you type or say to tell an AI what you want.', example: '"Explain dengue to my Lola in simple Tagalog."' }
];
const eps = [
{ n: 1, title: 'The Miracle Tea', status: 'Read', statusColor: '#1E7D50', strip: '#F5D89E', op: '1' },
{ n: 2, title: 'Lola’s Maintenance Meds', status: 'New!', statusColor: '#C4323A', strip: '#FFE6DD', op: '1' },
{ n: 3, title: 'Bea Asks the Bot', status: 'After Module 3', statusColor: '#6B7090', strip: '#F3ECDD', op: '0.72' }
];
return {
tabs: tabs, myths: myths, terms: terms, eps: eps,
showMyths: s.tab === 'myths', showDict: s.tab === 'dict', showKomiks: s.tab === 'komiks'
};
}
}
</script>
</body>
</html>
