<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ara</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: block;">
<svg width="{{size}}" height="{{size}}" viewBox="0 0 120 120" role="img" aria-label="Ara, the ARAW sun-spirit guide">
<g fill="#E8B84A">
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(0 60 56)"></ellipse>
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(30 60 56)"></ellipse>
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(60 60 56)"></ellipse>
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(90 60 56)"></ellipse>
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(120 60 56)"></ellipse>
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(240 60 56)"></ellipse>
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(270 60 56)"></ellipse>
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(300 60 56)"></ellipse>
<ellipse cx="60" cy="14" rx="9" ry="15" transform="rotate(330 60 56)"></ellipse>
</g>
<g fill="#F5D89E">
<ellipse cx="60" cy="22" rx="7" ry="11" transform="rotate(15 60 56)"></ellipse>
<ellipse cx="60" cy="22" rx="7" ry="11" transform="rotate(45 60 56)"></ellipse>
<ellipse cx="60" cy="22" rx="7" ry="11" transform="rotate(75 60 56)"></ellipse>
<ellipse cx="60" cy="22" rx="7" ry="11" transform="rotate(285 60 56)"></ellipse>
<ellipse cx="60" cy="22" rx="7" ry="11" transform="rotate(315 60 56)"></ellipse>
<ellipse cx="60" cy="22" rx="7" ry="11" transform="rotate(345 60 56)"></ellipse>
</g>
<path d="M34 120 Q35 94 60 92 Q85 94 86 120 Z" fill="#35408E"></path>
<path d="M52 92 L60 102 L68 92 Z" fill="#FFF8EC"></path>
<circle cx="74" cy="108" r="4" fill="#F5D89E"></circle>
<circle cx="60" cy="60" r="30" fill="#E2A77E"></circle>
<path d="M29 56 Q33 28 60 27 Q87 28 91 56 Q82 43 72 47 Q64 36 55 46 Q44 39 29 56 Z" fill="#E8B84A"></path>
<path d="M44 40 Q52 33 60 33" stroke="#F5D89E" stroke-width="3" stroke-linecap="round" fill="none"></path>
<sc-if value="{{wink}}" hint-placeholder-val="{{false}}">
<path d="M43 63 Q48 59 53 63" stroke="#1F2550" stroke-width="3" stroke-linecap="round" fill="none"></path>
</sc-if>
<sc-if value="{{notWink}}" hint-placeholder-val="{{true}}">
<ellipse cx="48" cy="63" rx="4" ry="5" fill="#1F2550"></ellipse>
<circle cx="49.5" cy="61" r="1.5" fill="#FFFFFF"></circle>
</sc-if>
<ellipse cx="72" cy="63" rx="4" ry="5" fill="#1F2550"></ellipse>
<circle cx="73.5" cy="61" r="1.5" fill="#FFFFFF"></circle>
<circle cx="40" cy="73" r="5" fill="#FF7A59" opacity="0.45"></circle>
<circle cx="80" cy="73" r="5" fill="#FF7A59" opacity="0.45"></circle>
<sc-if value="{{wow}}" hint-placeholder-val="{{false}}">
<ellipse cx="60" cy="78" rx="5" ry="6" fill="#1F2550"></ellipse>
</sc-if>
<sc-if value="{{smile}}" hint-placeholder-val="{{true}}">
<path d="M51 75 Q60 84 69 75" stroke="#1F2550" stroke-width="3" stroke-linecap="round" fill="none"></path>
</sc-if>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"size":{"editor":"int","default":240,"min":24,"max":480},"mood":{"editor":"enum","options":["happy","wow","wink"],"default":"happy"},"$preview":{"width":240,"height":240}}'>
class Component extends DCLogic {
renderVals() {
const size = Number(this.props.size ?? 240);
const mood = this.props.mood ?? 'happy';
return {
size: size,
px: size + 'px',
wow: mood === 'wow',
smile: mood !== 'wow',
wink: mood === 'wink',
notWink: mood !== 'wink'
};
}
}
</script>
</body>
</html>
