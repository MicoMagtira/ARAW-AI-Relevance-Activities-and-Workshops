</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { sel: 3 }; }
renderVals() {
const mods = [
{ n: 1, title: 'What Is AI, Really?', short: 'What Is AI?', game: 'AI or Not?' },
{ n: 2, title: 'How AI Learns and Makes Mistakes', short: 'How AI Learns', game: 'Turuan si AI' },
{ n: 3, title: 'AI and Your Health', short: 'AI and Your Health', game: 'Tanong kay Chatbot' },
{ n: 4, title: 'Tricks of Health Misinformation', short: 'Misinfo Tricks', game: 'Spot the Tactic + Fact or Fake' },
{ n: 5, title: 'Check Before You Share', short: 'Check Before Sharing', game: "Tita's GC" },
{ n: 6, title: 'Katuwang si AI: AI and Jobs', short: 'Katuwang si AI', game: 'Hati Tayo!' },
{ n: 7, title: 'Gawa ni AI? Generative AI and Creativity', short: 'Gawa ni AI?', game: "Gawa Ko 'To!" },
{ n: 8, title: 'Pahinga Muna: Digital Wellbeing', short: 'Pahinga Muna', game: 'Tulog na, Bea!' },
{ n: 9, title: 'Para sa Lahat: Fairness and Access', short: 'Para sa Lahat', game: 'Sa Sapatos Nila' },
{ n: 10, title: 'Karapatan Mo: Your Rights', short: 'Karapatan Mo', game: 'OBJECTION!' }
];
const dxs = ['0px', '64px', '96px', '64px', '0px', '-64px', '-96px', '-64px', '0px', '64px'];
const done = 2, cur = 3;
const items = mods.map((m, i) => {
const isDone = m.n <= done, isCur = m.n === cur, isLocked = m.n > cur;
const selected = this.state.sel === m.n;
return Object.assign({}, m, {
dx: dxs[i],
done: isDone, current: isCur, locked: isLocked,
bg: isDone ? '#F5D89E' : (isCur ? '#35408E' : '#F3ECDD'),
ring: selected ? '#FF7A59' : (isDone ? '#E8B84A' : (isCur ? '#35408E' : '#E3D8C0')),
shadow: isDone ? '#C9962E' : (isCur ? '#1F2550' : '#D8CDB4'),
label: isLocked ? '#6B7090' : '#1F2550',
aria: 'Module ' + m.n + ': ' + m.title + (isDone ? ', completed' : (isCur ? ', in progress' : ', locked')),
pick: () => this.setState({ sel: m.n })
});
});
const s = items[this.state.sel - 1];
return {
first: items.slice(0, 5),
second: items.slice(5),
sel: {
n: s.n, title: s.title, game: s.game,
status: s.done ? 'COMPLETED' : (s.current ? 'IN PROGRESS' : 'LOCKED · FINISH MODULE ' + (s.n - 1) + ' FIRST'),
open: !s.locked,
cta: s.done ? 'Replay module' : 'Continue module'
}
};
}
}
</script>
